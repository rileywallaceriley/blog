name: Proofread HipHopDX Archive

on:
  push:
    branches: [main]
    paths:
      - 'scripts/proofread_hiphopdx.py'
      - '.github/workflows/proofread-hiphopdx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply reviewed text corrections
        run: python3 scripts/proofread_hiphopdx.py
      - name: Commit corrected JSON
        run: |
          if ! git diff --quiet -- posts_hiphopdx.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts_hiphopdx.json
            git commit -m "Proofread HipHopDX archive copy and formatting"
            git push
          fi
