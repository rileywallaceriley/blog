name: Apply HipHopDX copyedits 1-50
on:
  push:
    paths:
      - '.github/workflows/hiphopdx-copyedit-1-50.yml'
jobs:
  copyedit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply conservative copyedits
        run: python scripts/proofread_hiphopdx_1_50.py
      - name: Commit only the updated JSON
        run: |
          if git diff --quiet -- posts_hiphopdx.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_hiphopdx.json
          git commit -m "Proofread HipHopDX JSON articles 1-50"
          git push origin HEAD:main
